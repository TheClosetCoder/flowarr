name: Cut a release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Highest existing vX.Y.Z tag, or v0.0.0 if this is the first release ever.
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          [ -z "$latest" ] && latest="v0.0.0"

          IFS='.' read -r major minor patch <<< "${latest#v}"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Bumping $latest -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      # docker-publish.yml matches on "v*.*.*" pushes, but a tag pushed using the default
      # GITHUB_TOKEN doesn't trigger other workflows (GitHub's anti-recursion safeguard) -
      # workflow_dispatch is exempt from that safeguard, so dispatch it explicitly instead.
      - name: Trigger image build for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "${{ steps.version.outputs.tag }}"
