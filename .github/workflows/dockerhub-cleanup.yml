name: Cleanup Docker Hub tags

on:
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "Number of most recent sha tags to keep"
        required: false
        default: "10"
      dry_run:
        description: "List tags that would be deleted without deleting them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old sha-tagged images from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP: ${{ github.event.inputs.keep || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          repo="$DOCKERHUB_USERNAME/flowarr"

          jwt=$(curl -s -H "Content-Type: application/json" \
            -X POST -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Failed to authenticate with Docker Hub" >&2
            exit 1
          fi

          # Walk every page, newest first, collecting all tag names.
          page=1
          all_tags=()
          while : ; do
            response=$(curl -s -H "Authorization: JWT $jwt" \
              "https://hub.docker.com/v2/repositories/$repo/tags/?page_size=100&page=$page&ordering=-last_updated")
            names=$(echo "$response" | jq -r '.results[].name')
            [ -z "$names" ] && break
            while IFS= read -r name; do all_tags+=("$name"); done <<< "$names"
            next=$(echo "$response" | jq -r '.next')
            [ "$next" = "null" ] && break
            page=$((page + 1))
          done

          # docker-publish.yml tags every build with its short git sha (pure hex, no prefix), on top
          # of "latest" and semver tags. Semver/latest are the ones users actually pull, so only the
          # sha tags - identifiable by being pure hex with no dots - are candidates for deletion.
          sha_tags=()
          for t in "${all_tags[@]}"; do
            if [[ "$t" =~ ^[0-9a-f]{7,40}$ ]]; then
              sha_tags+=("$t")
            fi
          done

          echo "Found ${#sha_tags[@]} sha tags out of ${#all_tags[@]} total; keeping the $KEEP most recent."

          to_delete=("${sha_tags[@]:$KEEP}")

          if [ "${#to_delete[@]}" -eq 0 ]; then
            echo "Nothing to delete."
            exit 0
          fi

          for tag in "${to_delete[@]}"; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete $repo:$tag"
            else
              echo "Deleting $repo:$tag"
              curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" \
                -X DELETE -H "Authorization: JWT $jwt" \
                "https://hub.docker.com/v2/repositories/$repo/tags/$tag/"
            fi
          done
