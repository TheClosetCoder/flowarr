services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowarr
      POSTGRES_USER: flowarr
      POSTGRES_PASSWORD: flowarr
    volumes:
      - flowarr-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowarr -d flowarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Flowarr.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Flowarr: Host=postgres;Port=5432;Database=flowarr;Username=flowarr;Password=flowarr
      Flowarr__QBittorrent__BaseUrl: ${FLOWARR_QBITTORRENT_BASE_URL:-}
      Flowarr__QBittorrent__Username: ${FLOWARR_QBITTORRENT_USERNAME:-}
      Flowarr__QBittorrent__Password: ${FLOWARR_QBITTORRENT_PASSWORD:-}
      Flowarr__Radarr__BaseUrl: ${FLOWARR_RADARR_BASE_URL:-}
      Flowarr__Radarr__ApiKey: ${FLOWARR_RADARR_API_KEY:-}
      Flowarr__Storage__LocalPath: /media
      Flowarr__Storage__SeedboxPathOrEndpoint: ${FLOWARR_SEEDBOX_PATH_OR_ENDPOINT:-/seedbox}
      Flowarr__Cleanup__DryRun: "true"
      Flowarr__AutoDownload__Enabled: ${FLOWARR_AUTO_DOWNLOAD_ENABLED:-false}
      Flowarr__AutoDownload__LocalImportPath: /media/import
      Flowarr__AutoDownload__OverwriteExisting: ${FLOWARR_AUTO_DOWNLOAD_OVERWRITE_EXISTING:-false}
      Flowarr__SftpSeedbox__Host: ${FLOWARR_SFTP_HOST:-}
      Flowarr__SftpSeedbox__Port: ${FLOWARR_SFTP_PORT:-22}
      Flowarr__SftpSeedbox__Username: ${FLOWARR_SFTP_USERNAME:-}
      Flowarr__SftpSeedbox__Password: ${FLOWARR_SFTP_PASSWORD:-}
      Flowarr__SftpSeedbox__PrivateKeyPath: ${FLOWARR_SFTP_PRIVATE_KEY_PATH:-}
      Flowarr__SftpSeedbox__RemoteRootPath: ${FLOWARR_SFTP_REMOTE_ROOT_PATH:-}
      Flowarr__Security__DataProtectionKeysPath: /var/lib/flowarr/keys
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${FLOWARR_MEDIA_ROOT:-./data/media}:/media
      - ${FLOWARR_SEEDBOX_MOUNT_PATH:-./data/seedbox}:/seedbox:ro
      - ${FLOWARR_SFTP_PRIVATE_KEY_HOST_PATH:-./data/keys}:/keys:ro
      - flowarr-keys:/var/lib/flowarr/keys
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  flowarr-postgres:
  flowarr-keys:
